let state=0;const person=document.getElementById('person'), avatar=document.getElementById('avatar'), speech=document.getElementById('speech'), panel=document.getElementById('panel'), buttons=[...document.querySelectorAll('[data-note]')];
const modal=document.getElementById('resource-modal');let lastFocus=null;
function closeModal(){modal.close();}
modal.querySelector('.modal-close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target!==modal)return;const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();});
modal.addEventListener('close',()=>{document.body.classList.remove('modal-open');buttons.forEach(b=>b.setAttribute('aria-pressed','false'));if(lastFocus&&lastFocus.isConnected)lastFocus.focus();});
function updateDate(){const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const el=document.getElementById('today');el.dateTime=date;el.textContent=date.replaceAll('-',' / ');}
updateDate();setInterval(updateDate,60000);
poses.forEach(src=>{ const p=new Image();p.src=src; });
function show(i){buttons.forEach((b,j)=>b.setAttribute('aria-pressed',i===j?'true':'false'));const [tag,title,desc,status]=notes[i];panel.replaceChildren();for(const [k,t] of [['span',tag],['h2',title],['p',desc],['small',status]]){const el=document.createElement(k);el.textContent=t;if(k==='span')el.className='caption';if(k==='h2')el.id='modal-title';panel.append(el);}if(i===3){const link=document.createElement('a');link.href='https://cq.hifage.com/';link.target='_blank';link.rel='noopener noreferrer';link.textContent='体验像素传奇 ↗';link.className='panel-action';panel.append(link);}panel.classList.remove('reveal');void panel.offsetWidth;panel.classList.add('reveal');if(!modal.open){lastFocus=document.activeElement;modal.showModal();document.body.classList.add('modal-open');}}
function poke(){state=(state+1)%poses.length;avatar.src=poses[state];speech.textContent=lines[state];avatar.classList.remove('pop');void avatar.offsetWidth;avatar.classList.add('pop');}
person.addEventListener('click',poke);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const headline=document.querySelector('.headline-visual'),intro=document.querySelector('.intro-line');
let typingTimer=null;
function finishTyping(){if(typingTimer)clearInterval(typingTimer);headline.style.removeProperty('--visible-chars');headline.classList.remove('typing');intro.classList.remove('intro-wait');intro.classList.add('intro-ready');}
if(!reduced.matches){let typed=0;headline.style.setProperty('--visible-chars','0');headline.classList.add('typing');intro.classList.add('intro-wait');typingTimer=setInterval(()=>{typed++;headline.style.setProperty('--visible-chars',String(typed));if(typed>=7)finishTyping();},115);}
reduced.addEventListener('change',e=>{if(e.matches)finishTyping();});
buttons.forEach((b,i)=>{
 b.addEventListener('click',()=>{show(i); b.classList.remove('tapped');void b.offsetWidth;b.classList.add('tapped');setTimeout(()=>b.classList.remove('tapped'),800);});
 b.addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch')return;const r=b.getBoundingClientRect();b.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3));b.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3));});
 b.addEventListener('pointerleave',()=>{b.style.setProperty('--mx','0');b.style.setProperty('--my','0');});
});
</script></html>
